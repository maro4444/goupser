name: release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      # Ten krok tworzy tag i WYPYCHA go na serwer, co aktywuje mechanizm Release
      - name: Create and Push Automatic Tag
        run: |
          COMMITS_COUNT=$(git rev-list --count HEAD)
          # Pierwsze dwie liczby wersji pochodzą z pliku VERSION (tam jest opis zasad).
          PREFIX=$(grep -v '^[[:space:]]*#' VERSION | tr -d '\r[:blank:]' | grep -m1 . || true)
          if ! [[ "$PREFIX" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Plik VERSION musi zawierać numer w formacie X.Y (np. 1.0), a jest: '${PREFIX}'"
            exit 1
          fi
          TAG_NAME="v${PREFIX}.${COMMITS_COUNT}"

          # Nowe wydanie nie może być niższe od najwyższego istniejącego taga.
          HIGHEST=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -n "$HIGHEST" ] && [ "$(printf '%s\n%s\n' "$HIGHEST" "$TAG_NAME" | sort -V | tail -n1)" != "$TAG_NAME" ]; then
            echo "::error::Wersja ${TAG_NAME} byłaby niższa od istniejącej ${HIGHEST}. Zwiększ numer w pliku VERSION."
            exit 1
          fi
          
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git tag $TAG_NAME
          git push origin $TAG_NAME # Wypchnięcie taga na serwer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GoReleaser bez flagi snapshot automatycznie stworzy oficjalny wpis w zakładce Releases
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
